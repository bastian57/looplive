name: LoopLive Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (manual cmdline-tools)
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Gradle 8.7 (AGP 8.5.2 butuh min Gradle 8.7)
        run: |
          set -e
          cd /tmp
          curl -sL -o gradle-8.7-bin.zip "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          unzip -q -o gradle-8.7-bin.zip
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK (log ke build.log)
        run: |
          set -e
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk LoopLive-v1.0.0.apk
          ls -lh LoopLive-v1.0.0.apk build.log

      - name: Upload build.log artifact (selalu, walau build merah)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK ke rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "latest" --notes "Rolling latest build - LoopLive"
          gh release upload latest LoopLive-v1.0.0.apk --clobber
          gh release view build-log > /dev/null 2>&1 || gh release create build-log --title "build-log" --notes "Build logs - LoopLive"
          gh release upload build-log build.log --clobber
          echo "UPLOAD OK"
